name: Smoke test notebooks

# Executes every notebook headlessly (the whole suite takes ~3 minutes) plus a
# static check that committed notebooks carry no saved outputs or execution
# counts (see CLAUDE.md). The monthly schedule catches upstream breakage (data
# URLs going 404, seaborn-data moving) even when the repo is idle.
#
# This only proves a notebook runs error-free against requirements.txt's
# exact pinned versions. It does not run against Colab's own pandas, which
# can lag a major version behind (students open every notebook there via the
# "Open in Colab" badge), and it does not check that computed values still
# match what the surrounding prose claims about them. Both are manual review.

on:
  push:
    branches: [main]
    paths:
      - "**.ipynb"
      - "requirements.txt"
      - "smoke_test.py"
      - "quiz_site/quiz_status.py"
      - ".github/workflows/smoke.yml"
  schedule:
    - cron: "17 6 3 * *" # 06:17 UTC on the 3rd of each month
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # quiz staleness compares commit dates across history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned environment
        run: pip install -r requirements.txt
      - name: Execute all notebooks (includes static saved-state check)
        run: python smoke_test.py
      - name: Quiz staleness check (warns, never fails the build)
        continue-on-error: true
        run: python quiz_site/quiz_status.py --check
